<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Voa Rio! — O Rio aos seus pés. O céu à sua frente."
    >

    <meta
        name="theme-color"
        content="#0b1118"
    >

    <title>Voa Rio! | O Rio aos seus pés. O céu à sua frente.</title>


    <style>

        /* ==============================
           CONFIGURAÇÕES GERAIS
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;

            background: #0b1118;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        /* ==============================
           CABEÇALHO
        ============================== */

        .cabecalho {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            padding: 22px 20px;

            z-index: 20;
        }


        .cabecalho-conteudo {
            width: 100%;

            max-width: 1200px;

            margin: 0 auto;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {
            font-size: 26px;

            font-weight: 700;

            letter-spacing: -1px;

            color: #ffffff;
        }


        .botao-cabecalho {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 48px;

            padding: 0 21px;

            border-radius: 999px;

            background: #ffffff;

            color: #101820;

            font-size: 14px;

            font-weight: 700;
        }


        /* ==============================
           HERO
        ============================== */

        .hero {
            position: relative;

            min-height: 100vh;
            min-height: 100svh;

            display: flex;

            align-items: flex-end;

            overflow: hidden;

            background:
                linear-gradient(
                    to bottom,
                    rgba(7, 15, 23, 0.15),
                    rgba(7, 15, 23, 0.25) 40%,
                    rgba(7, 15, 23, 0.92) 100%
                ),
                url("hero.jpg")
                center center
                / cover
                no-repeat;
        }


        .hero-conteudo {
            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 1200px;

            margin: 0 auto;

            padding:
                0
                20px
                70px;

            color: #ffffff;
        }


        .hero-rotulo {
            margin-bottom: 15px;

            color: rgba(255, 255, 255, 0.85);

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2.5px;

            text-transform: uppercase;
        }


        .hero-titulo {
            max-width: 850px;

            margin-bottom: 25px;

            color: #ffffff;

            font-size:
                clamp(
                    54px,
                    15vw,
                    105px
                );

            font-weight: 700;

            line-height: 0.9;

            letter-spacing: -5px;
        }


        .hero-slogan {
            max-width: 600px;

            margin-bottom: 32px;

            color: #ffffff;

            font-size:
                clamp(
                    21px,
                    5.5vw,
                    30px
                );

            font-weight: 400;

            line-height: 1.35;
        }


        .botao-hero {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 52px;

            padding: 0 24px;

            border-radius: 999px;

            background: #ffffff;

            color: #101820;

            font-size: 15px;

            font-weight: 700;
        }


        /* ==============================
           TELAS MAIORES
        ============================== */

        @media (min-width: 768px) {

            .cabecalho {
                padding:
                    28px
                    35px;
            }


            .hero-conteudo {
                padding:
                    0
                    35px
                    95px;
            }


            .logo {
                font-size: 28px;
            }


            .botao-cabecalho {
                min-height: 50px;

                padding:
                    0
                    23px;
            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         CABEÇALHO
    ============================== -->

    <header class="cabecalho">

        <div class="cabecalho-conteudo">


            <a
                href="#inicio"
                class="logo"
            >
                Voa Rio!
            </a>


            <a
                href="https://wa.me/5521975899356?text=Ol%C3%A1!%20Tenho%20interesse%20em%20fazer%20um%20voo%20duplo.%20Gostaria%20de%20saber%20sobre%20disponibilidade."
                class="botao-cabecalho"
            >
                Quero voar
            </a>


        </div>

    </header>



    <!-- ==============================
         ABERTURA
    ============================== -->

    <main>

        <section
            class="hero"
            id="inicio"
        >

            <div class="hero-conteudo">


                <p class="hero-rotulo">
                    Voo livre no Rio de Janeiro
                </p>


                <h1 class="hero-titulo">
                    Voa Rio!
                </h1>


                <p class="hero-slogan">
                    O Rio aos seus pés.<br>
                    O céu à sua frente.
                </p>


                <a
                    href="https://wa.me/5521975899356?text=Ol%C3%A1!%20Tenho%20interesse%20em%20fazer%20um%20voo%20duplo.%20Gostaria%20de%20saber%20sobre%20disponibilidade."
                    class="botao-hero"
                >
                    Quero voar
                </a>


            </div>

        </section>


    </main>


</body>

</html>
